{% extends 'base.html' %}

{% block title %}Register - VetCare{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm max-w-md w-full space-y-6 mx-auto mt-12">
    <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full text-xl">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-900">Create Patient Account</h1>
        <p class="text-slate-500 text-xs">Register to manage pet profiles and book doctors</p>
    </div>
    <form method="post" action="{% url 'register' %}" class="space-y-4 text-xs">
        {% csrf_token %}
        <div>
            <label class="block text-slate-600 mb-1">Full Name</label>
            <input type="text" name="full_name" placeholder="John Doe" class="w-full border border-slate-200 rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-emerald-500" required>
        </div>
        <div>
            <label class="block text-slate-600 mb-1">Email Address</label>
            <input type="email" name="email" placeholder="owner@example.com" class="w-full border border-slate-200 rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-emerald-500" required>
        </div>
        <div>
            <label class="block text-slate-600 mb-1">Password</label>
            <input type="password" name="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" class="w-full border border-slate-200 rounded-xl p-2.5 outline-none focus:ring-1 focus:ring-emerald-500" required>
        </div>
        <button type="submit" class="block text-center w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition shadow-sm">
            Register Account
        </button>
        <p class="text-center text-slate-500 text-xs mt-2">Already have an account? <a href="{% url 'login' %}" class="text-emerald-600 font-bold hover:underline">Log In</a></p>
    </form>
</div>
{% endblock %}
